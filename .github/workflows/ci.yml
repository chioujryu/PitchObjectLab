name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONFAULTHANDLER: 1
  PYTHONUTF8: 1

jobs:
  Tests:
    name: RF-DETR tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.4"
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: projects/rf_detr_trainer/pyproject.toml
      - name: Install RF-DETR CPU test dependencies
        working-directory: projects/rf_detr_trainer
        run: uv pip install --no-config --no-sources --torch-backend cpu --requirements pyproject.toml
      - name: Run RF-DETR unit tests
        working-directory: projects/rf_detr_trainer
        run: python -u -m unittest discover -s tests -p "test_*.py" -v
