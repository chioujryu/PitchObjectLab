[project]
name = "dfine-seg-trainer"
version = "0.1.0"
description = "Config-first D-FINE-seg trainer with dataset conversion, rich augmentation controls, and reproducible outputs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "albumentations==2.0.8",
    "colorama>=0.4.6",
    "faster-coco-eval==1.6.5",
    "huggingface-hub==1.13.0",
    "hydra-core==1.3.2",
    "loguru==0.7.2",
    "matplotlib==3.10.3",
    "numpy==2.1.1",
    "omegaconf==2.3.0",
    "opencv-python-headless==4.10.0.84",
    "pandas==2.2.3",
    "pillow==12.2.0",
    "pycocotools==2.0.8; sys_platform != 'win32'",
    "pyyaml==6.0.2",
    "requests>=2.32.0",
    "scikit-learn==1.7.0",
    "scipy==1.15.1",
    "tabulate==0.9.0",
    "torch==2.9.0",
    "torchmetrics==1.7.4",
    "torchvision==0.24.0",
    "tqdm==4.66.5",
    "wandb==0.26.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
