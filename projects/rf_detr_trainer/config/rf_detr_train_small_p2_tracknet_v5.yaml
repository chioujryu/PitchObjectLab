  # Scheduled test interval in minutes. Options: 0 to disable or positive number.
  test_interval_minutes: 0
  # output_dir_name setting for this config block. Options: documented value for this RF-DETR config section.
  output_dir_name: periodic_tests
  # Run final test after training. Options: true, false.
  run_final_test: true
  # final_output_dir_name setting for this config block. Options: documented value for this RF-DETR config section.
  final_output_dir_name: final_test
  # Write per-class metrics. Options: true, false.
  classwise: true
  # Batch size. Options: positive integer or auto where supported.
  batch_size: 4
  # Error-case diagnostic settings. Options: mapping.
  error_cases:
    # Enable this feature/block. Options: true, false.
    enabled: true
    # Target class IDs. Options: list of integers or empty to use names/default.
    target_class_ids: []
    # Target class names. Options: list of strings or empty for defaults.
    target_class_names:
      - football
    # Rendered class IDs. Options: list of integers or empty for all.
    render_class_ids: []
    # Rendered class names. Options: list of strings or empty for all.
    render_class_names: []
    # Maximum images to process. Options: all/null for full data or positive integer.
    max_images: 300
    # max_missed_images setting for this config block. Options: documented value for this RF-DETR config section.
    max_missed_images: 300
    # max_false_positive_images setting for this config block. Options: documented value for this RF-DETR config section.
    max_false_positive_images: 300
    # Prediction confidence threshold. Options: 0.0-1.0.
    confidence_threshold: null
    # IoU threshold for matching. Options: 0.0-1.0.
    match_iou_threshold: null
    # output_subdir setting for this config block. Options: documented value for this RF-DETR config section.
    output_subdir: error_cases
    # format setting for this config block. Options: documented value for this RF-DETR config section.
    format: jpg
    # jpeg_quality setting for this config block. Options: documented value for this RF-DETR config section.
    jpeg_quality: 92
  # Progress-bar style/visibility. Options: tqdm, rich, true, false, null.
  progress_bar: true

# PyTorch Lightning trainer override settings. Options: mapping.
trainer:
  # Extra PyTorch Lightning Trainer arguments. Options: mapping.
  extra_trainer_args: {}

# Small demo/smoke-run overrides. Options: mapping.
demo:
  # Enable this feature/block. Options: true, false.
  enabled: false
  # Exact output directory override. Options: empty string, local path, or placeholder template.
  output_dir: "demo_runs/demo_small_p2_tracknet_v5_e{epochs}_{timestamp}"
  # max_epochs setting for this config block. Options: documented value for this RF-DETR config section.
  max_epochs: 2
  # max_batch_size setting for this config block. Options: documented value for this RF-DETR config section.
  max_batch_size: 2
  # max_grad_accum_steps setting for this config block. Options: documented value for this RF-DETR config section.
  max_grad_accum_steps: 1
  # Checkpoint save interval in epochs. Options: positive integer.
  checkpoint_interval: 1
  # Scheduled test interval in epochs. Options: 0 to disable or positive integer.
  test_interval_epochs: 1
  # Progress-bar style/visibility. Options: tqdm, rich, true, false, null.
  progress_bar: tqdm

