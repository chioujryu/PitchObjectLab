# Standalone SAHI 320 football recheck test-original config for test_rf_detr_model.py.
# Same execution schema as rf_detr_test.yaml, with test-original data paths.

# Runtime controls for dry-run, prompts, verbosity, seeds, and estimates. Options: mapping.
runtime:
  # Print wrapper status text. Options: true, false.
  verbose: true
  # Estimate outputs and exit before model loading/inference. Options: true, false.
  dry_run: false
  # Ask before writing output files. Options: true, false.
  confirm_before_run: true
  # Skip confirmation after reviewing the estimate. Options: true, false.
  yes: false
  # Seed for deterministic sampling. Options: integer.
  seed: 0
  # Runtime-estimate settings. Options: mapping.
  time_estimate:
    # Print rough HH:MM:SS runtime estimates before execution. Options: true, false.
    enabled: true
    # Prefer latest sibling run_timing.json throughput when available. Options: true, false.
    use_history: true
    # Fallback train speed retained for shared schema. Options: positive seconds per training batch.
    default_train_seconds_per_batch: 0.7
    # Fallback standalone test speed for first runs. Options: positive seconds per image.
    default_test_seconds_per_image: 0.25
    # Fallback inference speed retained for shared schema. Options: positive seconds per image/frame.
    default_inference_seconds_per_image: 0.25
    # Fallback video render speed retained for shared schema. Options: positive seconds per frame.
    default_video_render_seconds_per_frame: 0.005

# Model construction settings. Options: mapping.
model:
  # RF-DETR model size. Options: base, nano, small, medium, large, seg-preview, seg-nano, seg-small, seg-medium, seg-large, seg-xlarge, seg-2xlarge.
  size: medium
  # Checkpoint to test. Options: default, null/false, hosted key, or local checkpoint path.
  pretrain_weights: /home/new_users/zhiyu/projects/PitchObjectLab/runs/rf_detr/train/rfdetr_medium_motion_v5_e40_b4_20260710165058/checkpoint_best_total.pth
  # Input resolution override. Options: null or valid RF-DETR resolution integer.
  resolution: null
  # Class count override. Options: null or positive integer.
  num_classes: 1
  # Device selector. Options: auto, cpu, cuda, cuda:0, 0, 1, "0,1" for round-robin multi-GPU, mps, -1.
  device: cuda:6
  # RF-DETR AMP construction setting; separate from standalone inference_optimization. Options: true, false.
  amp: true
  # First-stage prediction confidence threshold. Options: 0.0-1.0.
  confidence_threshold: 0.25
  # Optional model label to dataset category-id mapping. Options: {}, false, or {model_label: dataset_category_id}.
  category_remapping: {}
  # Extra RF-DETR ModelConfig keys. Options: any supported model config key.
  extra_model_args: {}
  # Standalone inference/test acceleration settings. This does not change training-time AMP. Options: mapping.
  inference_optimization:
    # Inference runtime. Options: pytorch, tensorrt. PyTorch FP32 preserves the legacy behavior.
    backend: pytorch
    # PyTorch-only inference settings. Options: mapping.
    pytorch:
      # PyTorch compute precision. Options: fp32, bf16.
      precision: fp32
    # TensorRT-only inference settings. TensorRT is CUDA-only and fails instead of falling back. Options: mapping.
    tensorrt:
      # TensorRT engine precision. Options: fp16, bf16.
      precision: fp16
      # Existing serialized engine. Options: empty string for automatic cache/build, or a trusted .engine/.plan path.
      engine_path: ""
      # Project manifest paired with engine_path. Empty derives <engine>.manifest.json for an explicit engine. Options: empty string or manifest JSON path.
      manifest_path: ""
      # Engine/ONNX cache. Empty resolves to runs/rf_detr/tensorrt_cache under rf_detr_trainer; absolute paths remain supported.
      cache_dir: "runs/rf_detr/tensorrt_cache"
      # TensorRT builder workspace limit in GiB. Options: positive number.
      workspace_gib: 4
      # Ignore a valid cache entry and rebuild its artifacts. Options: true, false.
      force_rebuild: false
      # Dynamic-batch optimization profile. Spatial dimensions remain fixed to the model resolution. Options: mapping.
      profile:
        # Smallest accepted batch. Must stay 1 so real tail batches are valid. Options: 1.
        min_batch_size: 1
        # Preferred batch. Options: auto to infer from the task, or a positive integer.
        opt_batch_size: auto
        # Largest engine batch; larger calls are split into chunks. Options: auto to infer from the task, or a positive integer.
        max_batch_size: auto

  # P2 stride-4 feature-level settings. Required to load medium+P2 checkpoints (projector_scale [P2, P3, P4]).
  p2:
    # Enable P2 high-resolution feature level. Options: true, false.
    enabled: true
    # Feature levels for projector AND decoder. Options: P2, P3, P4, P5, P6 in ascending P-name order.
    projector_scale: [P2, P3, P4]
    # P2 projector implementation settings. Options: mapping.
    projector:
      # C2f depth per projector stage. Options: null for upstream default, or a positive integer.
      num_blocks: null
      # Stochastic-depth survival probability. Options: null for 1.0, or 0.0-1.0.
      survival_prob: null
      # Force-zero the last N ViT feature maps before projecting. Options: null for 0, or non-negative integer.
      force_drop_last_n_features: null
      # LayerNorm inside projector convs. Options: null to inherit model layer_norm, true, false.
      layer_norm: null
      # RMSNorm inside projector convs. Options: null to inherit model rms_norm, true, false.
      rms_norm: null
    # Pretrained-weight loading compatibility settings. Options: mapping.
    weights:
      # Suppress the expected PretrainWeightsCompatibilityWarning for projector_scale changes. Options: true, false.
      suppress_compat_warning: true
    # Validated RF-DETR model override keys. Options: mapping.
    overrides:
      # Input resolution override applied only when P2 is enabled. Options: null to use model.resolution, or a valid integer.
      resolution: null
      # Decoder query count. Options: null for model default, or positive integer.
      num_queries: null
      # Selected predictions at postprocess. Options: null for model default, or positive integer.
      num_select: null
      # Deformable-attention sampling points per level per head. Options: null for model default, or positive integer.
      dec_n_points: null
      # Gradient checkpointing flag in the rebuilt model config. Options: null, true, false.
      gradient_checkpointing: null

# Dataset discovery and limiting settings. Options: mapping.
dataset:
  # Dataset source format. Options: auto, rfdetr, roboflow, ultralytics_yolo, coco_json, pascal_voc, dota, labelme_json.
  source_format: ultralytics_yolo
  # Source dataset root. Options: RF-DETR/Roboflow root, YOLO root, VOC root, DOTA root, LabelMe root, or COCO root.
  dataset_dir: /home/new_users/zhiyu/datasets/soccer/spatial_perception/Xbotgo/soccer_ball_merged_v1/outputs/yolo_reviewed_sam3_augmented_320-1921_sahi_1280
  # Ultralytics YOLO dataset YAML. Options: empty string to auto-find, or YAML path.
  data_yaml: /home/new_users/zhiyu/datasets/soccer/spatial_perception/Xbotgo/soccer_ball_merged_v1/outputs/yolo_reviewed_sam3_augmented_320-1921_sahi_1280/dataset.yaml
  # COCO annotation file for coco_json. Options: empty string or JSON path.
  coco_json: ""
  # Image directory for coco_json. Options: empty string or image folder path.
  image_dir: ""
  # RF-DETR cache root. Options: relative or absolute path.
  cache_root: dataset_cache
  # Rebuild matching cache. Options: true, false.
  refresh_cache: false
  # Cache image placement. Options: auto, hardlink, symlink, junction, copy.
  link_mode: auto
  # Split ratio for unsplit datasets. Options: [train, valid, test] positive numbers.
  split_ratio: [8, 1, 1]
  # Deterministic split seed. Options: integer.
  split_seed: 0
  # Dataset file type forwarded to RF-DETR. Options: roboflow, coco, yolo, o365.
  dataset_file: roboflow

# Output directory settings and naming templates. Options: mapping.
output:
  # Exact output directory. Options: empty string, absolute path, relative path, or placeholder template.
  output_dir: ""
  # Output root when output_dir is empty. Supports placeholders such as {model_size}, {test_split}, {timestamp}.
  root: runs/rf_detr/test
  # Run folder name. Options: pure string or placeholder template.
  name: "rfdetr_{model_size}_motion_v5_e{epochs}_b{batch_size}_{timestamp}"
  # Allow existing output directory. Options: true, false.
  exist_ok: false

# Standalone test settings. Options: mapping.
test:
  # Dataset split. Options: test-original, test, val, valid, train.
  split: test
  # Maximum images to evaluate. Options: all/null for the full split, or a positive integer for first N images.
  max_images: all
  # Standalone multiprocessing settings. Options: mapping.
  parallel:
    # Balanced test-data chunks and concurrent model replicas. Options: positive integer; 1 disables multiprocessing and preserves the single-model path.
    chunks: 1
  # Test mode selector block. Options: mapping.
  test_mode:
    # Test mode. Options: full_image, class_crop, sahi.
    mode: sahi
  # Class-crop/object-crop test settings. Options: mapping.
  crop:
    # Crop class IDs. Empty means all predicted classes.
    class_ids: []
    # Crop class names. Empty means all predicted classes.
    class_names:
      - soccer_ball
    # Crop source. Options: prediction.
    source: prediction
    # Source prediction confidence. Options: 0.0-1.0.
    source_conf: 0.25
    # Fixed crop padding. Options: non-negative integer.
    padding_pixels: 0
    # Relative crop padding. Options: non-negative float.
    padding_ratio: 0.05
    # Fallback when no crop class is predicted. Options: full_image.
    fallback: full_image
  # SAHI sliced-inference settings. Options: mapping.
  sahi:
    # Slice height. Options: positive integer.
    slice_height: 640
    # Slice width. Options: positive integer.
    slice_width: 640
    # Height overlap. Options: 0.0-0.9.
    overlap_height_ratio: 0.2
    # Width overlap. Options: 0.0-0.9.
    overlap_width_ratio: 0.2
    # Merge full-image prediction with slices. Options: true, false. Use false when full-image boxes absorb close slice detections.
    standard_prediction: false
    # SAHI postprocess type. Options: GREEDYNMM, NMM, NMS, LSNMS. GREEDYNMM is recommended for small slices.
    postprocess_type: GREEDYNMM
    # SAHI match metric. Options: IOS, IOU. IOS is recommended to merge partial duplicate boxes from small slices.
    postprocess_match_metric: IOS
    # Merge/NMS threshold. Options: 0.0-1.0. Raise to merge fewer boxes; lower to merge more boxes.
    postprocess_match_threshold: 0.5
    # Class-agnostic merge. Options: true, false.
    postprocess_class_agnostic: false
    # RF-DETR SAHI slice/recheck batch size. Options: positive integer.
    batch_size: 64
    # recheck nested configuration block. Options: mapping.
    recheck:
      # Run a second centered B*B verification pass for selected SAHI target-class boxes. Options: true, false.
      enabled: false
      # Target category IDs for SAHI recheck. Empty means use target_class_names; if both empty and enabled, default is football.
      target_class_ids: []
      # Target category names for SAHI recheck. Empty with enabled defaults to football. Options: category names such as [football].
      target_class_names:
        - soccer_ball
      # B*B centered crop size for the second pass. Options: positive integer pixels.
      crop_size: 320
      # Confidence threshold for the second pass. Options: 0.0-1.0.
      second_confidence_threshold: 0.25
      # Weight applied to the first-stage confidence. Options: non-negative float.
      first_weight: 0.5
      # Weight applied to the best second-stage confidence. Options: non-negative float.
      second_weight: 0.5
      # Minimum fused confidence to keep the first-stage box. Options: 0.0-1.0.
      fused_confidence_threshold: 0.25
      # Extra relative padding around the first-stage box for center-hit matching. Options: non-negative float.
      center_padding_ratio: 0.0
      # Maximum target boxes rechecked per image. Options: 0 disables rechecking; positive integer caps by score.
      max_rechecks_per_image: 50
  # Visual sample filtering/rendering settings. Options: mapping.
  visual_samples:
    # Save sampled GT/prediction images. Options: true, false.
    enabled: true
    # Max sampled images; also caps error cases by default. Options: null or non-negative integer.
    max_images: 100
    # Output subfolder. Options: folder name or placeholder template.
    output_subdir: visuals
    # Sampling mode. Options: first, last, random.
    sampling_mode: first
    # Random seed. Options: null or integer.
    random_seed: null
    # Filter source. Options: ground_truth, prediction, either, both.
    filter_source: either
    # Filter match. Options: any, all.
    filter_match: any
    # Filter class IDs. Empty means no class filter.
    class_ids: []
    # Filter class names. Empty means no class filter.
    class_names: []
    # Category IDs to draw in visual images. Empty means draw all GT/prediction classes. Options: list of category IDs.
    render_class_ids: []
    # Category names to draw in visual images. Empty means draw all GT/prediction classes. Options: list of category names.
    render_class_names: []
    # Minimum GT instances. Options: non-negative integer.
    min_gt_instances: 0
    # Minimum predictions. Options: non-negative integer.
    min_predictions: 0
    # Minimum score for candidate filtering. Options: null or 0.0-1.0.
    filter_min_score: 0.25
    # Minimum score drawn. Options: null to use model.confidence_threshold, or 0.0-1.0.
    draw_min_score: null
  # Write per-class metrics. Options: true, false.
  classwise: true
  # Show progress bars. Options: true, false.
  progress_bar: true
  # Save plots. Options: true, false.
  plots: true
  # Save raw dataset case images. Options: true, false.
  save_dataset_cases: false
  # Model-input batch grid size. Options: positive integer.
  model_input_batch_size: 9
  # RF-DETR full-image/class-crop evaluator batch size. Options: positive integer.
  batch_size: 16
  # Adapter dataloader workers. Options: 2 by project rule.
  num_workers: 2
  # Max detections for metrics. Options: positive integer.
  max_dets: 500
  # IoU threshold for matching. Options: 0.0-1.0.
  match_iou_threshold: 0.5
  # Error-case diagnostic settings. Options: mapping.
  error_cases:
    # Save football diagnostics. Options: true, false.
    enabled: true
    # Target category IDs. Empty means use target_class_names.
    target_class_ids: []
    # Target category names. Default: football.
    target_class_names:
      - soccer_ball
    # Category IDs to draw in error-case images. Empty means draw all GT/prediction classes. Options: list of category IDs.
    render_class_ids: []
    # Category names to draw in error-case images. Empty means draw all GT/prediction classes. Options: list of category names.
    render_class_names: [soccer_ball]
    # Shared max diagnostic images. Options: null or non-negative integer.
    max_images: 100
    # Legacy missed-image cap. Options: null or non-negative integer.
    max_missed_images: 100
    # Legacy false-positive-image cap. Options: null or non-negative integer.
    max_false_positive_images: 100
    # Confidence for error matching. Options: null or 0.0-1.0.
    confidence_threshold: null
    # IoU for error matching. Options: null or 0.0-1.0.
    match_iou_threshold: null
    # Output subfolder. Options: folder name or placeholder template.
    output_subdir: error_cases
    # Image format. Options: jpg, png.
    format: jpg
    # JPEG quality. Options: 1-100.
    jpeg_quality: 92

# Metric/evaluation settings. Options: mapping.
evaluation:
  # Evaluation type. Options: auto, bbox, segm, segmentation, mask, masks.
  type: auto
  # Write per-class metrics. Options: true, false.
  classwise: true
  # COCO max detections. Options: one, two, or three positive integers.
  max_detections: [1, 10, 500]
  # Operating-point IoU threshold. Options: 0.0-1.0.
  match_iou_threshold: 0.5
