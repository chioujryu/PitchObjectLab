# Accuracy-preserving single-GPU Medium-P2 SAHI evaluation profile.
extends: rf_detr_test.yaml

runtime:
  performance_profile: safe
  cpu:
    torch_intraop_threads: auto

model:
  size: medium
  pretrain_weights: /path/to/rfdetr_medium_p2_checkpoint.pth
  resolution: 576
  p2:
    enabled: true
    projector_scale: [P2, P3, P4]
  inference_optimization:
    backend: pytorch
    pytorch:
      precision: bf16

test:
  parallel:
    chunks: 1
    allow_same_gpu_oversubscription: false
  test_mode:
    mode: sahi
  sahi:
    slice_height: 320
    slice_width: 320
    overlap_height_ratio: 0.2
    overlap_width_ratio: 0.2
    standard_prediction: false
    batch_size: auto
    recheck:
      enabled: true
      crop_size: 640
  artifacts:
    full_model_input_manifest: false

output:
  name: rfdetr_medium_p2_test_safe_{timestamp}
