# TrackNetV5-only FP16 TensorRT example for inference_rf_detr_model.py.
# Pass the trained checkpoint and media source with --checkpoint and --source.
runtime:
  # Bound numerical-library thread pools so RF-DETR does not monopolize the host. Options: mapping.
  cpu:
    # Enable the cross-platform CPU thread budget. Options: true, false.
    enabled: true
    # Percentage of logical CPUs shared by active model processes. Options: 1-100.
    budget_percent: 50
  verbose: true
  dry_run: false
  confirm_before_run: true

model:
  size: medium
  resolution: null
  pretrain_weights: null
  num_classes: null
  device: auto
  amp: true
  confidence_threshold: 0.25
  category_remapping: {}
  extra_model_args: {}
  inference_optimization:
    backend: tensorrt
    pytorch:
      precision: fp32
    tensorrt:
      precision: fp16
      engine_path: ''
      manifest_path: ''
      # Empty resolves to runs/rf_detr/tensorrt_cache under rf_detr_trainer; absolute paths remain supported.
      cache_dir: 'runs/rf_detr/tensorrt_cache'
      workspace_gib: 4
      force_rebuild: false
      profile:
        min_batch_size: 1
        opt_batch_size: 4
        max_batch_size: 4
  p2:
    enabled: false
  # This complete architecture block must match the checkpoint used for inference.
  motion:
    enabled: true
    type: tracknet_v5
    temporal:
      num_frames: 3
      frame_stride: 1
      fallback_mode: identity
      noise_std: 0.02
    tracknet_v5:
      mdd:
        enabled: true
        polarity_channels: 4
        attention:
          learnable: true
          init_k: 1.0
          init_m: 0.5
      rstr:
        enabled: true
        num_blocks: 2
        hidden_dim: 256
        num_heads: 8
        attention_mode: divided
        dropout: 0.1
        use_pixel_shuffle: true
        context_mask_prob: 0.1
    loss:
      motion_attention_weight: 0.0
    overrides:
      resolution: null
      num_queries: null
      num_select: null
      gradient_checkpointing: true

dataset:
  # Display/export class names supplied independently from checkpoint tensor shapes.
  class_names: [football]
  data_yaml: ''

output:
  output_dir: ''
  root: runs/rf_detr/inference
  name: 'rfdetr_tracknet_tensorrt_fp16_{timestamp}'
  exist_ok: false

inference:
  sources: []
  recursive: true
  max_sources: all
  max_images: all
  max_videos: all
  mode: full_image
  batch_size: 4
  image_extensions: [.bmp, .jpeg, .jpg, .png, .tif, .tiff, .webp]
  video_extensions: [.avi, .m4v, .mkv, .mov, .mp4, .mpeg, .mpg, .webm]
  render_class_ids: []
  render_class_names: []
  save_predictions_jsonl: true
  # Concise per-football center-coordinate JSONL output. Options: mapping.
  football_output:
    # Write football_predictions.jsonl beside the full predictions file. Options: true, false.
    enabled: true
    # Category IDs to export. Non-empty IDs take precedence over names. Options: list of category IDs.
    target_class_ids: []
    # Category names to export when IDs are empty. Empty defaults to football. Options: names such as [football].
    target_class_names: [football]
  # Canonical V2 video bundle for VLM training and offline full-video inference. Options: mapping.
  canonical_output:
    # Produce canonical_v2 metadata, frame, track, and clean-media artifacts for video sources. Options: true, false.
    enabled: true
    # Bundle directory inside the run output. Options: relative directory name or path.
    directory: canonical_v2
    # FFmpeg executable used to create clean clips. Options: auto for PATH discovery, or an executable path.
    ffmpeg_path: auto
    # FFprobe executable used for stream metadata and validation. Options: auto for PATH discovery, or an executable path.
    ffprobe_path: auto
    # Clean, overlay-free selected-video encoding settings. Options: mapping.
    media:
      # Output video encoder. Options: an FFmpeg encoder such as libx264.
      video_codec: libx264
      # Constant-rate-factor quality value; lower is higher quality. Options: integer supported by the encoder.
      crf: 18
      # Video encoder speed/compression tradeoff. Options: an FFmpeg preset such as medium.
      preset: medium
      # Broadly compatible output pixel format. Options: an FFmpeg pixel format such as yuv420p.
      pixel_format: yuv420p
      # Audio encoder used when the source has audio. Options: an FFmpeg encoder such as aac.
      audio_codec: aac
      # Audio bitrate used when the source has audio. Options: FFmpeg bitrate string such as 192k.
      audio_bitrate: 192k
  video:
    detection_fps: null
    batch_size: null
    start_time: 0
    end_time: all
    max_seconds: all
    output_fps: null
    render_skipped_frames: true
  tracking:
    # Tracking is disabled in this TensorRT architecture example. Options: true, false.
    enabled: false
    # Draw a live predicted center during detection gaps; Hybrid also limits it to predicted_output_seconds. Options: true, false.
    draw_predicted_center: false
    # Hide target-class detections whose Hybrid tracks never become confirmed. Hybrid-only; must remain false for other algorithms. Options: true, false.
    render_confirmed_only: false
    # Filter unconfirmed target-class detections from predictions.jsonl and football_predictions.jsonl only. Hybrid-only; must remain false for other algorithms. Options: true, false.
    export_confirmed_only: false
