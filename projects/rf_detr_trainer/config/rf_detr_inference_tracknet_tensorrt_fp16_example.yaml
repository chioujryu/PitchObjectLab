# TrackNetV5-only FP16 TensorRT example for inference_rf_detr_model.py.
# Pass the trained checkpoint and media source with --checkpoint and --source.
runtime:
  verbose: true
  dry_run: false
  confirm_before_run: true

model:
  size: medium
  resolution: null
  pretrain_weights: null
  num_classes: null
  device: auto
  amp: true
  confidence_threshold: 0.25
  category_remapping: {}
  extra_model_args: {}
  inference_optimization:
    backend: tensorrt
    pytorch:
      precision: fp32
    tensorrt:
      precision: fp16
      engine_path: ''
      manifest_path: ''
      # Empty resolves to runs/rf_detr/tensorrt_cache under rf_detr_trainer; absolute paths remain supported.
      cache_dir: 'runs/rf_detr/tensorrt_cache'
      workspace_gib: 4
      force_rebuild: false
      profile:
        min_batch_size: 1
        opt_batch_size: 4
        max_batch_size: 4
  p2:
    enabled: false
  # This complete architecture block must match the checkpoint used for inference.
  motion:
    enabled: true
    type: tracknet_v5
    temporal:
      num_frames: 3
      frame_stride: 1
      fallback_mode: identity
      noise_std: 0.02
    tracknet_v5:
      mdd:
        enabled: true
        polarity_channels: 4
        attention:
          learnable: true
          init_k: 1.0
          init_m: 0.5
      rstr:
        enabled: true
        num_blocks: 2
        hidden_dim: 256
        num_heads: 8
        attention_mode: divided
        dropout: 0.1
        use_pixel_shuffle: true
        context_mask_prob: 0.1
    loss:
      motion_attention_weight: 0.0
    overrides:
      resolution: null
      num_queries: null
      num_select: null
      gradient_checkpointing: true

dataset:
  class_names: []
  data_yaml: ''

output:
  output_dir: ''
  root: runs/rf_detr/inference
  name: 'rfdetr_tracknet_tensorrt_fp16_{timestamp}'
  exist_ok: false

inference:
  sources: []
  recursive: true
  max_sources: all
  max_images: all
  max_videos: all
  mode: full_image
  batch_size: 4
  image_extensions: [.bmp, .jpeg, .jpg, .png, .tif, .tiff, .webp]
  video_extensions: [.avi, .m4v, .mkv, .mov, .mp4, .mpeg, .mpg, .webm]
  render_class_ids: []
  render_class_names: []
  save_predictions_jsonl: true
  video:
    detection_fps: null
    batch_size: null
    start_time: 0
    end_time: all
    max_seconds: all
    output_fps: null
    render_skipped_frames: true
  tracking:
    enabled: false
