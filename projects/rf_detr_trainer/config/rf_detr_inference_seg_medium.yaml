# NOTE: segmentation config. The target dataset (all_parameters_SAHI_640_classesall_max_samples2000)
# is bbox-only (no masks), so it CANNOT train/evaluate segmentation here. Use these with a dataset
# that has polygon masks, or for model-build verification of seg-* + P2.
# Standalone config for inference_rf_detr_model.py.
# Parameters are grouped by runtime, model, dataset, output, inference, and evaluation.

# Runtime controls for dry-run, prompts, verbosity, seeds, and estimates. Options: mapping.
runtime:
  # Print wrapper status text. Options: true, false.
  verbose: true
  # Estimate outputs and exit before model loading/inference. Options: true, false.
  dry_run: false
  # Ask before writing rendered images/videos, predictions, configs, or URL caches. Options: true, false.
  confirm_before_run: true
  # Skip confirmation after reviewing the estimate. Options: true, false.
  yes: false
  # Seed reserved for deterministic future sampling. Options: integer.
  seed: 0
  # Runtime-estimate settings. Options: mapping.
  time_estimate:
    # Print rough HH:MM:SS runtime estimates before execution. Options: true, false.
    enabled: true
    # Prefer latest sibling run_timing.json throughput when available. Options: true, false.
    use_history: true
    # Fallback train speed retained for shared schema. Options: positive seconds per training batch.
    default_train_seconds_per_batch: 0.7
    # Fallback test speed retained for shared schema. Options: positive seconds per image.
    default_test_seconds_per_image: 0.25
    # Fallback inference speed for image sources and video detection frames. Options: positive seconds per image/frame.
    default_inference_seconds_per_image: 0.25
    # Fallback cost for drawing/writing output video frames. Options: positive seconds per frame.
    default_video_render_seconds_per_frame: 0.005

# Model construction settings. Options: mapping.
model:
  # RF-DETR model size. Detection: base, nano, small, medium, large. Segmentation sizes are not used by this bbox renderer.
  size: seg-medium
  # RF-DETR checkpoint to load. Options: default, null/false, hosted key, or local .pth/.pt/.ckpt path.
  pretrain_weights: default
  # Input resolution override. Options: null for model default, or positive integer.
  resolution: null
  # Class count override. Options: null to infer from checkpoint/config, or positive integer.
  num_classes: null
  # Device selector. Options: auto, cpu, cuda, cuda:0, 0, 1, mps, -1.
  device: 0
  # RF-DETR AMP construction setting; separate from standalone inference_optimization. Options: true, false.
  amp: true
  # Prediction confidence threshold used for rendered boxes. Options: 0.0-1.0.
  confidence_threshold: 0.25
  # Optional model label to output category-id mapping. Options: empty mapping, false to disable, or {model_label: category_id}.
  category_remapping: {}
  # Extra RF-DETR ModelConfig keys. Options: any supported model config key.
  extra_model_args: {}
  # Standalone inference/test acceleration settings. This does not change training-time AMP. Options: mapping.
  inference_optimization:
    # Inference runtime. Options: pytorch, tensorrt. PyTorch FP32 preserves the legacy behavior.
    backend: pytorch
    # PyTorch-only inference settings. Options: mapping.
    pytorch:
      # PyTorch compute precision. Options: fp32, bf16.
      precision: fp32
    # TensorRT-only inference settings. TensorRT is CUDA-only and fails instead of falling back. Options: mapping.
    tensorrt:
      # TensorRT engine precision. Options: fp16, bf16.
      precision: fp16
      # Existing serialized engine. Options: empty string for automatic cache/build, or a trusted .engine/.plan path.
      engine_path: ""
      # Project manifest paired with engine_path. Empty derives <engine>.manifest.json for an explicit engine. Options: empty string or manifest JSON path.
      manifest_path: ""
      # Engine/ONNX cache. Empty resolves to runs/rf_detr/tensorrt_cache under rf_detr_trainer; absolute paths remain supported.
      cache_dir: "runs/rf_detr/tensorrt_cache"
      # TensorRT builder workspace limit in GiB. Options: positive number.
      workspace_gib: 4
      # Ignore a valid cache entry and rebuild its artifacts. Options: true, false.
      force_rebuild: false
      # Dynamic-batch optimization profile. Spatial dimensions remain fixed to the model resolution. Options: mapping.
      profile:
        # Smallest accepted batch. Must stay 1 so real tail batches are valid. Options: 1.
        min_batch_size: 1
        # Preferred batch. Options: auto to infer from the task, or a positive integer.
        opt_batch_size: auto
        # Largest engine batch; larger calls are split into chunks. Options: auto to infer from the task, or a positive integer.
        max_batch_size: auto

  # ---- P2 high-resolution feature level (stride-4) for tiny-object (e.g. football) detection ----
  # RF-DETR has no native P2. When enabled, the trainer applies an in-process patch (rf_detr_p2.py,
  # version-controlled, survives `uv sync`) that (1) allows "P2" in projector_scale and (2) teaches
  # the backbone the P2 (scale-factor 4.0) branch the projector already implements (two stride-2
  # ConvTranspose2d). The decoder's deformable-attention levels, level embeds, two-stage query
  # selection, and per-level positional encoding all adapt automatically. Pretrained weights load
  # non-strictly: the new P2 projector stage and the resized deformable-attention layers start
  # randomly initialized, so fine-tune from a checkpoint. Same model.size + model.p2 block must be
  # set in test/inference configs to rebuild a P2-trained checkpoint.
  # Memory note: P2 (stride-4) dominates token count. If you hit OOM, set overrides.gradient_checkpointing: true,
  # lower train.batch_size + raise train.grad_accum_steps, and/or raise num_windows via extra_model_args.
  p2:
    # Master switch. Options: false to disable (no patch applied, stock RF-DETR), true to enable P2.
    enabled: true
    # Feature levels for projector AND decoder. Must be ascending P-name order; length = decoder levels.
    # name -> (stride, scale): P2->(4, x4), P3->(8, x2), P4->(16, x1), P5->(32, x0.5), P6->(64, x0.25).
    # Must include "P2" to actually use the P2 level. Examples: [P2, P3, P4], [P2, P3, P4, P5], [P2, P4].
    projector_scale: [P2, P3, P4]
    # P2 projector implementation settings. Options: mapping.
    projector:
      # MultiScaleProjector internals applied to EVERY stage (P2 included). null = upstream default.
      # NOTE: these are NOT stored in the checkpoint's ModelConfig. If you change them at train time,
      # set the same values in the test/inference config so the rebuilt architecture matches.
      # C2f (CSPRepLayer) depth per stage. Options: null for upstream default (3), or a positive integer.
      num_blocks: null
      # Stochastic-depth survival probability for extra feature levels during training. Options: null for 1.0 (off), or 0.0-1.0.
      survival_prob: null
      # Force-zero the last N ViT feature maps before projecting. Options: null for 0 (off), or non-negative integer.
      force_drop_last_n_features: null
      # LayerNorm inside projector convs. Options: null to inherit model layer_norm, true, false.
      layer_norm: null
      # RMSNorm inside projector convs. Options: null to inherit model rms_norm, true, false.
      rms_norm: null
    # Pretrained-weight loading compatibility settings. Options: mapping.
    weights:
      # RF-DETR loads pretrained weights with strict=False already; new P2/decoder params are random-init.
      # Suppress the expected PretrainWeightsCompatibilityWarning for the projector_scale change. Options: true, false.
      suppress_compat_warning: true
    # Validated RF-DETR model override keys. Options: mapping.
    overrides:
      # Convenience overrides applied to the RF-DETR ModelConfig only when P2 is enabled. null = leave
      # the variant default / value from the model.* section. When set, these win over model.*.
      # Input resolution. Options: null, or int divisible by patch_size * num_windows. Higher helps small objects.
      resolution: null
      # Decoder query count. Options: null, or positive integer. Raise for many same-frame objects (balls+players+refs).
      num_queries: null
      # Selected predictions at postprocess. Options: null, or positive integer. Usually match num_queries.
      num_select: null
      # Deformable-attention sampling points per level per head. Options: null, or positive integer (upstream 2 or 4).
      dec_n_points: null
      # Gradient checkpointing to fit the larger P2 token count in memory. Options: null, true, false.
      gradient_checkpointing: null

  # ---- TrackNetV5 motion module ----
  # The config must match the motion architecture used to train the checkpoint.
  # Applied after the DINOv2 backbone, before the Deformable-DETR decoder.
  # Patches LWDETR.forward in-process; survives uv sync.
  motion:
    # Master switch. Options: true, false.
    enabled: false
    # Motion module type. Options: tracknet_v5, none.
    type: tracknet_v5

    # Temporal frame-context settings. Options: mapping.
    temporal:
      # Number of frames in the temporal window. Options: positive integer (3 recommended).
      num_frames: 3
      # Stride between frames when using real video data. Options: positive integer.
      frame_stride: 1
      # How to synthesise multi-frame input for single-frame datasets.
      # Options:
      #   identity — all T frames identical (Δ=0, zero motion maps, identity gate).
      #   noise    — add Gaussian noise (noise_std) to produce synthetic deltas.
      #   zero     — same as identity but explicitly zeroes delta tensors.
      fallback_mode: identity
      # Standard deviation of synthetic Gaussian noise when fallback_mode: noise.
      # Options: non-negative float. ~0.02 simulates minor camera shake.
      noise_std: 0.02

    # TrackNetV5 motion submodule settings. Options: mapping.
    tracknet_v5:
      # Motion difference decomposition settings. Options: mapping.
      mdd:
        # Enable Motion Direction Decoupling polarity fields. Options: true, false.
        enabled: true
        # Output channels *per polarity field* (P⁺ and P⁻ each). Must be even.
        # Total motion_channels = 2 * polarity_channels, fed to feature gates.
        # Options: positive even integer. 4 = 2 per polarity, 8 = 4 per polarity.
        polarity_channels: 4
        # attention nested configuration block. Options: mapping.
        attention:
          # Learn sigmoid steepness (k) and midpoint (m) per channel. Options: true, false.
          learnable: true
          # Initial k (steepness). Options: positive float. 1.0 = gentle sigmoid.
          init_k: 1.0
          # Initial m (midpoint). Options: float. 0.5 = threshold at 0.5 polarity intensity.
          init_m: 0.5

      # R-STR refinement settings. Options: mapping.
      rstr:
        # Enable R-STR spatial refinement head. Options: true, false.
        enabled: true
        # Number of stacked spatial self-attention blocks per scale. Options: positive integer.
        num_blocks: 2
        # Internal projection dimension for attention. Options: positive integer.
        hidden_dim: 256
        # Multi-head attention heads. Must divide hidden_dim evenly. Options: positive integer.
        num_heads: 8
        # Factorised attention mode (spatial only for Phase-1 T=1).
        # Options: divided (factorised), joint.
        attention_mode: divided
        # Dropout inside attention and FFN. Options: 0.0-0.5.
        dropout: 0.1
        # Use PixelShuffle upsampling on the refinement delta. Options: true, false.
        use_pixel_shuffle: true
        # Stochastic context masking probability during training (paper: ρ=0.1).
        # Randomly zeros spatial tokens to prevent over-reliance on any one region.
        # Options: 0.0-0.3. 0.0 disables.
        context_mask_prob: 0.1

    # loss nested configuration block. Options: mapping.
    loss:
      # Motion attention auxiliary loss weight (reserved for future regularisation).
      # Options: non-negative float. 0.0 disables (recommended until real motion data).
      motion_attention_weight: 0.0

    # Validated RF-DETR model override keys. Options: mapping.
    overrides:
      # Convenience overrides applied only when motion is enabled.
      # resolution, num_queries, num_select, gradient_checkpointing — same semantics
      # as model.p2.overrides. null leaves the model default.
      resolution: null
      # num_queries setting for this config block. Options: documented value for this RF-DETR config section.
      num_queries: null
      # Number of selected predictions. Options: positive integer.
      num_select: null
      # gradient_checkpointing setting for this config block. Options: documented value for this RF-DETR config section.
      gradient_checkpointing: true

# Dataset discovery and limiting settings. Options: mapping.
dataset:
  # Class names for labels/colors. Options: list like [standing_player, football], mapping like {0: football}, or [] to label by ID.
  class_names:
    - standing_player
    - football
    - goal
  # Optional dataset YAML used only to read names when class_names is empty. Options: empty string or path to YAML with names.
  data_yaml: ""

# Output directory settings and naming templates. Options: mapping.
output:
  # Exact output directory. Options: empty string to use root/name, absolute path, or relative path.
  output_dir: ""
  # Output root when output_dir is empty. Options: pure string path.
  root: runs/rf_detr/all_parameters_SAHI_640/inference
  # Run folder name when output_dir is empty. Supports {timestamp}. Options: string.
  name: "rfdetr_inference_{timestamp}"
  # Allow writing into an existing output directory. Options: true, false.
  exist_ok: false

# Inference source, batching, rendering, and tracking settings. Options: mapping.
inference:
  # Input sources. Options: image path, video path, folder path, HTTP(S) image/video URL; folders may mix images and videos.
  sources: []
  # Recurse into folders. Options: true, false.
  recursive: true
  # Maximum discovered sources to infer after image/video caps. Options: all/null for every source, or a positive integer.
  max_sources: all
  # Maximum image sources to infer. Options: all/null for every image, or a positive integer for first N images.
  max_images: all
  # Maximum video sources to infer. Options: all/null for every video, or a positive integer for first N videos.
  max_videos: all
  # Inference mode. Options: full_image, sahi, class_crop.
  mode: full_image
  # RF-DETR image-source batch size for full_image/class_crop/sahi image inputs. Options: positive integer.
  batch_size: 8
  # Image extensions included from folders. Options: list of extensions.
  image_extensions: [.bmp, .jpeg, .jpg, .png, .tif, .tiff, .webp]
  # Video extensions included from folders. Options: list of extensions.
  video_extensions: [.avi, .m4v, .mkv, .mov, .mp4, .mpeg, .mpg, .webm]
  # Category IDs to render. Empty means draw all predicted classes. Options: list of category IDs.
  render_class_ids: []
  # Category names to render. Empty means draw all predicted classes. Options: list of names.
  render_class_names: []
  # Save line-delimited prediction records. Options: true, false.
  save_predictions_jsonl: true
  # Video inference settings. Options: mapping.
  video:
    # Detection FPS for videos. Options: null to detect every frame, or positive float such as 5.
    detection_fps: null
    # RF-DETR detection-frame batch size. Options: all/null to inherit inference.batch_size, or positive integer.
    batch_size: null
    # Start time for each video segment. Options: seconds, MM:SS, or HH:MM:SS.
    start_time: 0
    # End time for each video segment. Options: all/null for video end, seconds, MM:SS, or HH:MM:SS.
    end_time: all
    # Maximum selected duration to infer per video. Options: all/null for the full start/end range, seconds, MM:SS, or HH:MM:SS.
    max_seconds: all
    # Output video FPS. Options: null to preserve input FPS, or positive float.
    output_fps: null
    # Draw latest detections on skipped frames when detection_fps is lower than video FPS. Options: true, false.
    render_skipped_frames: true
  # Video tracking settings. Options: mapping.
  tracking:
    # Enable tracking for video inference. Options: true, false.
    enabled: false
    # Tracking algorithm. Options: circle (built-in stdlib motion-only ball tracker), ocsort, deepocsort, botsort, bytetrack (via boxmot). ocsort/bytetrack need no ReID download; deepocsort/botsort use appearance ReID.
    algorithm: circle
    # Category IDs to track. Empty means use target_class_names. Options: list of category IDs.
    target_class_ids: []
    # Category names to track. Empty with no target_class_ids defaults to football. Options: names such as [football].
    target_class_names:
      - football
    # Base search radius (pixels) around a ball center for same-ball matching. Options: positive number.
    radius_pixels: 80
    # Optional size-relative base radius: max(radius_pixels, radius_scale * max(bbox_w, bbox_h)). Options: null to disable, or positive number.
    radius_scale: null
    # Radius growth per missing detection frame, to catch fast/returning balls after gaps. Options: non-negative number.
    radius_growth_per_missing_frame: 0.0
    # Hard cap on the grown effective radius (pixels). Options: null for no cap, or positive number.
    max_radius_pixels: null
    # Frames a track may stay unmatched before it expires (finite avoids stale-track clutter). Options: all/null to never expire, or a non-negative integer.
    max_missing_frames: 30
    # Matches before a track is confirmed; only confirmed tracks draw trails/labels and count in the summary. Options: positive integer.
    min_hits: 1
    # Match against both the static circle and a velocity-predicted circle during gaps. Options: true, false.
    use_velocity_prediction: false
    # EMA weight on previous velocity when use_velocity_prediction is true (higher = smoother). Options: 0.0-1.0.
    velocity_smoothing: 0.5
    # Draw trajectory polyline for tracked balls in rendered videos. Options: true, false.
    draw_trajectory: true
    # Trajectory length in points/frames. null = full history (kept in memory up to 1024 points). Options: null, or a positive integer.
    trajectory_max_points: 30
    # Trail points older than this many video frames are dropped, so the trajectory retracts and disappears after the ball is lost. null = persist (never expire). Options: null, or a positive integer.
    trajectory_max_age_frames: 30
    # Trajectory line width (pixels). Options: positive integer.
    trajectory_width: 2
    # Use a distinct color per track for trajectories (bbox color stays the class color). Options: true, false.
    trajectory_per_track_color: true
    # Taper the trajectory from thin (old) to thick (new). Options: true, false.
    trajectory_taper: true
    # Mark the current ball center with a filled dot. Options: true, false.
    draw_current_center: true
    # Draw the current search circle for each active track (debug overlay). Options: true, false.
    draw_search_circle: false
    # Include the track ID in rendered football labels, e.g. "football #3 0.91". Options: true, false.
    label_track_id: true
    # --- shared boxmot ReID / camera-motion (used by deepocsort/botsort; ignored when algorithm: circle) ---
    # Local ReID .pt weights for deepocsort/botsort appearance. Options: null to auto-download (gdown/Google Drive, unreliable in CN/HK/MO/TW), or a local path such as weights/osnet_x0_25_msmt17.pt.
    reid_weights: null
    # Device for the ReID appearance model. Options: null to inherit model.device, or cpu, cuda, cuda:0, mps.
    reid_device: null
    # FP16 ReID inference (GPU only; forced false on cpu/mps). Options: true, false.
    reid_half: false
    # Camera-motion compensation for boxmot trackers (helps panning cameras). Options: ecc, orb, sof, null to disable.
    cmc_method: ecc
    # Track each class with a separate ID space. Options: true, false.
    per_class: false
    # --- OC-SORT params (used when algorithm: ocsort) ---
    ocsort:
      # Detection confidence gate. Options: 0.0-1.0.
      det_thresh: 0.2
      # Frames a track survives without matching. Options: positive integer.
      max_age: 30
      # Matches before a track is output. Options: positive integer.
      min_hits: 3
      # Association gate (IoU-based; OC-SORT names this asso_threshold, not iou_threshold). Options: 0.0-1.0.
      asso_threshold: 0.3
      # Time window for observation-centric momentum. Options: positive integer.
      delta_t: 3
      # Association function. Options: iou, giou, ciou, diou, centroid.
      asso_func: iou
      # Momentum/inertia weight for direction consistency. Options: 0.0-1.0.
      inertia: 0.2
      # Also associate low-confidence boxes (BYTE-style). Options: true, false.
      use_byte: false
      # Kalman process-noise scale on POSITION velocity (vx, vy); scales Q[4:6,4:6]. Higher trusts the constant-velocity model less (observations correct position faster; better for erratic/bouncing balls), lower is smoother and trusts prediction more. Options: positive float (boxmot default 0.01).
      Q_xy_scaling: 0.01
      # Kalman process-noise scale on box-SCALE velocity (size growth rate); scales Q[-1,-1]. Higher lets box size change faster frame-to-frame (ball nearing/leaving camera), lower holds size steadier. Options: positive float (boxmot default 0.0001).
      Q_s_scaling: 0.0001
    # --- Deep OC-SORT params (used when algorithm: deepocsort) ---
    deepocsort:
      # Detection confidence gate. Options: 0.0-1.0.
      det_thresh: 0.3
      # Frames a track survives without matching. Options: positive integer.
      max_age: 30
      # Matches before a track is output. Options: positive integer.
      min_hits: 3
      # IoU association gate (Deep OC-SORT names this iou_threshold). Options: 0.0-1.0.
      iou_threshold: 0.3
      # Time window for observation-centric momentum. Options: positive integer.
      delta_t: 3
      # Association function. Options: iou, giou, ciou, diou, centroid.
      asso_func: iou
      # Momentum/inertia weight. Options: 0.0-1.0.
      inertia: 0.2
      # Appearance-embedding association weight. Options: 0.0-1.0.
      w_association_emb: 0.5
      # Fixed-alpha EMA weight for appearance memory. Options: 0.0-1.0.
      alpha_fixed_emb: 0.95
      # Disable appearance embeddings (motion-only; skips ReID download). Options: true, false.
      embedding_off: false
      # Disable internal camera-motion compensation. Options: true, false.
      cmc_off: false
    # --- BoT-SORT params (used when algorithm: botsort) ---
    botsort:
      # High detection threshold (first association). Options: 0.0-1.0.
      track_high_thresh: 0.5
      # Low detection threshold (second association). Options: 0.0-1.0.
      track_low_thresh: 0.1
      # Threshold to start a new track. Options: 0.0-1.0.
      new_track_thresh: 0.6
      # Frames a lost track is buffered. Options: positive integer.
      track_buffer: 30
      # Association match threshold. Options: 0.0-1.0.
      match_thresh: 0.8
      # Proximity (IoU) gate for appearance association. Options: 0.0-1.0.
      proximity_thresh: 0.5
      # Appearance similarity gate. Options: 0.0-1.0.
      appearance_thresh: 0.25
      # Use appearance ReID (false = motion-only, no ReID download). Options: true, false.
      with_reid: true
      # Fuse detection score during first association. Options: true, false.
      fuse_first_associate: false
    # --- ByteTrack params (used when algorithm: bytetrack) ---
    bytetrack:
      # Detection confidence gate (ByteTrack names this track_thresh). Options: 0.0-1.0.
      track_thresh: 0.45
      # Association match threshold. Options: 0.0-1.0.
      match_thresh: 0.8
      # Frames a lost track is buffered. Options: positive integer.
      track_buffer: 25
      # Video frame rate used for buffer timing. Options: positive integer.
      frame_rate: 30

# Class-crop/object-crop test settings. Options: mapping.
crop:
  # Class IDs used to find class_crop windows from model predictions. Empty means all predicted classes are eligible.
  class_ids: []
  # Class names used to find class_crop windows from model predictions. Empty means all predicted classes are eligible.
  class_names: []
  # Crop source. Options: prediction.
  source: prediction
  # Confidence threshold for the first pass that finds the crop window. Options: 0.0-1.0.
  source_conf: 0.25
  # Fixed crop padding in pixels. Options: non-negative integer.
  padding_pixels: 0
  # Relative crop padding around the union box. Options: non-negative float.
  padding_ratio: 0.05
  # Behavior when no crop class is predicted. Options: full_image.
  fallback: full_image

# SAHI sliced-inference settings. Options: mapping.
sahi:
  # Slice height for sahi mode. Options: positive integer.
  slice_height: 640
  # Slice width for sahi mode. Options: positive integer.
  slice_width: 640
  # Height overlap between adjacent slices. Options: 0.0-0.9.
  overlap_height_ratio: 0.2
  # Width overlap between adjacent slices. Options: 0.0-0.9.
  overlap_width_ratio: 0.2
  # Also run full-image prediction and merge with slices. Options: true, false.
  standard_prediction: true
  # SAHI postprocess type. Options: GREEDYNMM, NMM, NMS, LSNMS. GREEDYNMM is recommended for small slices.
  postprocess_type: GREEDYNMM
  # SAHI match metric. Options: IOS, IOU. IOS is recommended when small slice boxes cover parts of the same object.
  postprocess_match_metric: IOS
  # Slice merge/NMS threshold. Options: 0.0-1.0.
  postprocess_match_threshold: 0.5
  # Class-agnostic slice merge. Options: true, false.
  postprocess_class_agnostic: false
  # RF-DETR SAHI slice/recheck batch size. Options: positive integer.
  batch_size: 4
  # recheck nested configuration block. Options: mapping.
  recheck:
    # Run a second centered B*B verification pass for selected SAHI target-class boxes. Options: true, false.
    enabled: false
    # Target category IDs for SAHI recheck. Empty means use target_class_names; if both empty and enabled, default is football.
    target_class_ids: []
    # Target category names for SAHI recheck. Empty with enabled defaults to football. Options: category names such as [football].
    target_class_names:
      - football
    # B*B centered crop size for the second pass. Options: positive integer pixels.
    crop_size: 960
    # Confidence threshold for the second pass. Options: 0.0-1.0.
    second_confidence_threshold: 0.25
    # Weight applied to the first-stage confidence. Options: non-negative float.
    first_weight: 0.5
    # Weight applied to the best second-stage confidence. Options: non-negative float.
    second_weight: 0.5
    # Final minimum score for every prediction class when inference.mode=sahi and recheck is enabled. Options: 0.0-1.0.
    fused_confidence_threshold: 0.25
    # Extra relative padding around the first-stage box for center-hit matching. Options: non-negative float.
    center_padding_ratio: 0.0
    # Maximum target boxes rechecked per image. Options: 0 disables rechecking; positive integer caps by score.
    max_rechecks_per_image: 50

# Metric/evaluation settings. Options: mapping.
evaluation:
  # Reserved for consistency with train/test configs. Options: bbox.
  type: bbox
