# Canonical RF-DETR Medium + TrackNetV5-inspired temporal-head preset.
# Official Medium resolution is selected by leaving model.resolution null (576).
extends: rf_detr_train_small_tracknet_v5.yaml

model:
  size: medium
  resolution: null
  p2:
    enabled: false
  motion:
    temporal:
      backbone_grad_mode: center_only
    overrides:
      resolution: null
      gradient_checkpointing: true

train:
  batch_size: 1
  grad_accum_steps: 1
  num_workers: 2
  early_stopping: false

output:
  name: "rfdetr_medium_tracknet_v5_e{epochs}_b{batch_size}_{timestamp}"
