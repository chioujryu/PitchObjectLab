# RF-DETR Small Stock test preset for test_rf_detr_model.py.
# Stock test uses the official RF-DETR Small weights and default 512x512 resolution.
# Architecture switches: P2=off, TrackNetV5=off.
# Relative outputs and an empty TensorRT cache setting resolve under rf_detr_trainer.

# Runtime controls for dry-run, prompts, verbosity, seeds, and estimates. Options: mapping.
runtime:
  # Bound numerical-library thread pools so RF-DETR does not monopolize the host. Options: mapping.
  cpu:
    # Enable the cross-platform CPU thread budget. Options: true, false.
    enabled: true
    # Percentage of logical CPUs shared by active model processes. Options: 1-100.
    budget_percent: 50
  # Print wrapper status text. Options: true, false.
  verbose: true
  # Estimate outputs and exit before model loading/inference. Options: true, false.
  dry_run: false
  # Ask before writing images, metrics, configs, or cache files. Options: true, false.
  confirm_before_run: true
  # Skip confirmation after reviewing the estimate. Options: true, false.
  yes: false
  # Seed used for deterministic visual sampling. Options: integer.
  seed: 0
  # Runtime-estimate settings. Options: mapping.
  time_estimate:
    # Print rough HH:MM:SS runtime estimates before execution. Options: true, false.
    enabled: true
    # Prefer latest sibling run_timing.json throughput when available. Options: true, false.
    use_history: true
    # Fallback train speed retained for shared schema. Options: positive seconds per training batch.
    default_train_seconds_per_batch: 1.4
    # Fallback standalone test speed for first runs. Options: positive seconds per image.
    default_test_seconds_per_image: 0.35
    # Fallback inference speed retained for shared schema. Options: positive seconds per image/frame.
    default_inference_seconds_per_image: 0.35
    # Fallback video render speed retained for shared schema. Options: positive seconds per frame.
    default_video_render_seconds_per_frame: 0.005

# Model construction settings. Options: mapping.
model:
  # RF-DETR model size. Detection: base, nano, small, medium, large. Segmentation: seg-preview, seg-nano, seg-small, seg-medium, seg-large, seg-xlarge, seg-2xlarge.
  size: small
  # Official Stock Small checkpoint. Options: default, hosted key, or local .pth/.pt/.ckpt path.
  pretrain_weights: default
  # Input resolution override. Options: null for model default, or an int divisible by model window requirements.
  resolution: null
  # Class count override. Options: null to infer from dataset, or positive integer.
  num_classes: null
  # Device selector. Options: auto, cpu, cuda, cuda:0, 0, 1, "0,1" for round-robin multi-GPU, mps, -1.
  device: auto
  # RF-DETR AMP construction setting; separate from standalone inference_optimization. Options: true, false.
  amp: true
  # Prediction confidence threshold used by inference and operating metrics. Options: 0.0-1.0.
  confidence_threshold: 0.25
  # Optional model label to dataset category-id mapping. Options: empty mapping, false to disable, or {model_label: dataset_category_id}.
  category_remapping: {}
  # Extra RF-DETR ModelConfig keys. Options: any supported model config key.
  extra_model_args: {}
  # Standalone inference/test acceleration settings. This does not change training-time AMP. Options: mapping.
  inference_optimization:
    # Inference runtime. Options: pytorch, tensorrt. PyTorch FP32 preserves the legacy behavior.
    backend: pytorch
    # PyTorch-only inference settings. Options: mapping.
    pytorch:
      # PyTorch compute precision. Options: fp32, bf16.
      precision: fp32
    # TensorRT-only inference settings. TensorRT is CUDA-only and fails instead of falling back. Options: mapping.
    tensorrt:
      # TensorRT engine precision. Options: fp16, bf16.
      precision: fp16
      # Existing serialized engine. Options: empty string for automatic cache/build, or a trusted .engine/.plan path.
      engine_path: ""
      # Project manifest paired with engine_path. Empty derives <engine>.manifest.json for an explicit engine. Options: empty string or manifest JSON path.
      manifest_path: ""
      # Engine/ONNX cache. Empty resolves to runs/rf_detr/tensorrt_cache under rf_detr_trainer; absolute paths remain supported.
      cache_dir: "runs/rf_detr/tensorrt_cache"
      # TensorRT builder workspace limit in GiB. Options: positive number.
      workspace_gib: 4
      # Ignore a valid cache entry and rebuild its artifacts. Options: true, false.
      force_rebuild: false
      # Dynamic-batch optimization profile. Spatial dimensions remain fixed to the model resolution. Options: mapping.
      profile:
        # Smallest accepted batch. Must stay 1 so real tail batches are valid. Options: 1.
        min_batch_size: 1
        # Preferred batch. Options: auto to infer from the task, or a positive integer.
        opt_batch_size: auto
        # Largest engine batch; larger calls are split into chunks. Options: auto to infer from the task, or a positive integer.
        max_batch_size: auto

  # ---- P2 high-resolution feature level (stride-4) for tiny-object soccer-ball detection ----
  # RF-DETR has no native P2. When enabled, the trainer applies an in-process patch (rf_detr_p2.py,
  # version-controlled, survives `uv sync`) that allows "P2" in projector_scale and teaches
  # the backbone the P2 (scale-factor 4.0) branch the projector already implements.
  p2:
    # Master switch. Options: false to disable, true to enable P2.
    enabled: false
    # Feature levels for projector AND decoder. Options include P2, P3, P4, P5, P6 in ascending P-name order.
    projector_scale: [P2, P3, P4]
    # P2 projector implementation settings. Options: mapping.
    projector:
      # C2f depth per projector stage. Options: null for upstream default, or a positive integer.
      num_blocks: null
      # Stochastic-depth survival probability for extra feature levels. Options: null for 1.0, or 0.0-1.0.
      survival_prob: null
      # Force-zero the last N ViT feature maps before projecting. Options: null for 0, or non-negative integer.
      force_drop_last_n_features: null
      # LayerNorm inside projector convs. Options: null to inherit model layer_norm, true, false.
      layer_norm: null
      # RMSNorm inside projector convs. Options: null to inherit model rms_norm, true, false.
      rms_norm: null
    # Pretrained-weight loading compatibility settings. Options: mapping.
    weights:
      # Suppress the expected PretrainWeightsCompatibilityWarning for projector_scale changes. Options: true, false.
      suppress_compat_warning: true
    # Validated RF-DETR model override keys. Options: mapping.
    overrides:
      # Input resolution override applied only when P2 is enabled. Options: null to use model.resolution, or a valid integer.
      resolution: null
      # Decoder query count. Options: null for model default, or positive integer.
      num_queries: null
      # Selected predictions at postprocess. Options: null for model default, or positive integer.
      num_select: null
      # Deformable-attention sampling points per level per head. Options: null for model default, or positive integer.
      dec_n_points: null
      # Gradient checkpointing flag in the rebuilt model config. Options: null, true, false.
      gradient_checkpointing: true
  # TrackNetV5-inspired motion-module settings. This checkpoint has no motion_module weights.
  motion:
    # Master switch. Options: false to disable, true to enable motion modules.
    enabled: false
    # Motion module type. Options: tracknet_v5, none.
    type: tracknet_v5
    # Temporal frame-context settings. Options: mapping.
    temporal:
      # Number of frames in the temporal window. Options: positive odd integer.
      num_frames: 3
      # Temporal stride between frames. Options: positive integer.
      frame_stride: 1
      # Synthetic fallback for still images. Options: identity, noise, real.
      fallback_mode: identity
      # Noise standard deviation when fallback_mode=noise. Options: non-negative float.
      noise_std: 0.02
    # TrackNetV5 motion submodule settings. Options: mapping.
    tracknet_v5:
      # Motion Direction Decoupling settings. Options: mapping.
      mdd:
        # Enable MDD polarity fields. Options: true, false.
        enabled: true
        # Total motion channels are 2 * polarity_channels. Options: positive integer.
        polarity_channels: 4
        # MDD attention settings. Options: mapping.
        attention:
          # Learn attention parameters. Options: true, false.
          learnable: true
          # Initial sigmoid sharpness. Options: positive float.
          init_k: 1.0
          # Initial sigmoid midpoint. Options: float.
          init_m: 0.5
      # Regional Spatio-Temporal Refinement settings. Options: mapping.
      rstr:
        # Enable R-STR refinement. Options: true, false.
        enabled: true
        # Number of R-STR blocks. Options: positive integer.
        num_blocks: 2
        # Hidden dimension. Options: positive integer.
        hidden_dim: 256
        # Attention heads. Options: positive integer.
        num_heads: 8
        # Attention mode. Options: divided, joint.
        attention_mode: divided
        # Dropout probability. Options: 0.0-1.0.
        dropout: 0.1
        # Use pixel shuffle in refinement. Options: true, false.
        use_pixel_shuffle: true
        # Context mask probability. Options: 0.0-1.0.
        context_mask_prob: 0.1
    # Motion auxiliary-loss settings. Options: mapping.
    loss:
      # Motion attention auxiliary loss weight. Options: non-negative float; 0.0 disables.
      motion_attention_weight: 0.0
    # Validated RF-DETR model override keys for motion models. Options: mapping.
    overrides:
      # Input resolution override. Options: null to use model.resolution, or a valid integer.
      resolution: null
      # Decoder query count. Options: null for model default, or positive integer.
      num_queries: null
      # Selected predictions at postprocess. Options: null for model default, or positive integer.
      num_select: null
      # Gradient checkpointing flag for motion-enabled models. Options: null, true, false.
      gradient_checkpointing: true

# Dataset discovery and limiting settings. Options: mapping.
dataset:
  # Dataset source format. Options: auto, rfdetr, roboflow, ultralytics_yolo, coco_json, pascal_voc, dota, labelme_json.
  source_format: ultralytics_yolo
  # Source dataset root. Options: RF-DETR/Roboflow root, YOLO root, VOC root, DOTA root, LabelMe root, or COCO root.
  dataset_dir: /home/new_users/zhiyu/datasets/soccer/spatial_perception/Xbotgo/soccer_ball_merged_v1/outputs/yolo_reviewed_sam3_augmented_320-1921_sahi_1280
  # Ultralytics YOLO dataset YAML. Options: empty string to auto-find, or YAML path.
  data_yaml: /home/new_users/zhiyu/datasets/soccer/spatial_perception/Xbotgo/soccer_ball_merged_v1/outputs/yolo_reviewed_sam3_augmented_320-1921_sahi_1280/dataset.yaml
  # COCO annotation file for coco_json source_format. Options: empty string to auto-find, or JSON path.
  coco_json: ""
  # Image directory used with coco_json. Options: empty string to infer from dataset_dir, or image folder path.
  image_dir: ""
  # RF-DETR-readable cache root. Options: relative path under this project, or absolute path.
  cache_root: dataset_cache
  # Rebuild dataset cache even when fingerprint matches. Options: true, false.
  refresh_cache: false
  # How to place images in cache. Options: auto, hardlink, symlink, junction, copy.
  link_mode: auto
  # Split ratio for unsplit datasets, order train/valid/test. Options: three positive numbers.
  split_ratio: [8, 1, 1]
  # Deterministic split seed. Options: integer.
  split_seed: 0
  # Dataset file type forwarded to RF-DETR. Options: roboflow, coco, yolo, o365.
  dataset_file: roboflow

# Output directory settings and naming templates. Options: mapping.
output:
  # Exact output directory. Options: empty string to use root/name, absolute path, or relative path.
  # Supports placeholders: {timestamp}, {date}, {time}, {model_size}, {resolution}, {pretrain}, {num_classes},
  # {dataset_name}, {dataset_file}, {source_format}, {device}, {epochs}, {batch_size}, {grad_accum_steps},
  # {effective_batch}, {lr}, {lr_encoder}, {weight_decay}, {workers}, {checkpoint_interval},
  # {eval_interval}, {test_interval_epochs}, {test_interval_minutes}, {test_split}, {logger_project}, {logger_run}.
  output_dir: ""
  # Output root when output_dir is empty. Options: pure string or placeholder template.
  root: runs/rf_detr/test
  # Run folder name when output_dir is empty. Options: pure string or placeholder template.
  name: "rfdetr_small_stock_{test_split}_{timestamp}"
  # Allow writing into an existing output directory. Options: true, false.
  exist_ok: false

# Standalone test settings. Options: mapping.
test:
  # Dataset split to test. Options: test-original, test, val, valid, train.
  split: test
  # Maximum images to evaluate. Options: all/null for the full split, or a positive integer for first N images.
  max_images: all
  # Standalone multiprocessing settings. Options: mapping.
  parallel:
    # Balanced test-data chunks and concurrent model replicas. Options: positive integer; 1 disables multiprocessing and preserves the single-model path.
    chunks: 1
  # Test mode selector block. Options: mapping.
  test_mode:
    # Test mode. Options: full_image, class_crop, sahi.
    mode: full_image
  # Class-crop/object-crop test settings. Options: mapping.
  crop:
    # Class IDs used to find class_crop windows from model predictions. Empty means all predicted classes are eligible.
    class_ids: []
    # Class names used to find class_crop windows from model predictions. Empty means all predicted classes are eligible.
    class_names:
      - soccer_ball
    # Crop source. Options: prediction.
    source: prediction
    # Confidence threshold for the first pass that finds the crop window. Options: 0.0-1.0.
    source_conf: 0.25
    # Fixed crop padding in pixels. Options: non-negative integer.
    padding_pixels: 0
    # Relative crop padding around the union box. Options: non-negative float, e.g. 0.05.
    padding_ratio: 0.05
    # Behavior when no crop class is predicted. Options: full_image.
    fallback: full_image
  # SAHI sliced-inference settings. Options: mapping.
  sahi:
    # Slice height for sahi mode. Options: positive integer.
    slice_height: 640
    # Slice width for sahi mode. Options: positive integer.
    slice_width: 640
    # Height overlap between adjacent slices. Options: 0.0-0.9.
    overlap_height_ratio: 0.2
    # Width overlap between adjacent slices. Options: 0.0-0.9.
    overlap_width_ratio: 0.2
    # Also run full-image prediction and merge with slices. Options: true, false.
    standard_prediction: true
    # SAHI postprocess type. Options: GREEDYNMM, NMM, NMS, LSNMS. GREEDYNMM is recommended for small slices.
    postprocess_type: GREEDYNMM
    # SAHI match metric. Options: IOS, IOU. IOS is recommended when small slice boxes cover parts of the same object.
    postprocess_match_metric: IOS
    # Slice merge/NMS threshold. Options: 0.0-1.0. Raise to merge fewer boxes; lower to merge more boxes.
    postprocess_match_threshold: 0.5
    # Class-agnostic slice merge. Options: true, false.
    postprocess_class_agnostic: false
    # RF-DETR SAHI slice/recheck batch size. Options: positive integer.
    batch_size: 4
    # recheck nested configuration block. Options: mapping.
    recheck:
      # Run a second centered B*B verification pass for selected SAHI target-class boxes. Options: true, false.
      enabled: true
      # Target category IDs for SAHI recheck. Empty means use target_class_names; if both empty and enabled, default is football.
      target_class_ids: []
      # Target category names for SAHI recheck. Empty with enabled defaults to football. Options: category names such as [soccer_ball].
      target_class_names:
        - soccer_ball
      # B*B centered crop size for the second pass. Options: positive integer pixels.
      crop_size: 960
      # Confidence threshold for the second pass. Options: 0.0-1.0.
      second_confidence_threshold: 0.25
      # Weight applied to the first-stage confidence. Options: non-negative float.
      first_weight: 0.5
      # Weight applied to the best second-stage confidence. Options: non-negative float.
      second_weight: 0.5
      # Minimum fused confidence to keep the first-stage box. Options: 0.0-1.0.
      fused_confidence_threshold: 0.25
      # Extra relative padding around the first-stage box for center-hit matching. Options: non-negative float.
      center_padding_ratio: 0.0
      # Maximum target boxes rechecked per image. Options: 0 disables rechecking; positive integer caps by score.
      max_rechecks_per_image: 50
  # Visual sample filtering/rendering settings. Options: mapping.
  visual_samples:
    # Save sampled prediction test images with GT and predictions. Options: true, false.
    enabled: true
    # Maximum sampled prediction images to save; also caps error-case images by default. Options: null for all candidates, or non-negative integer.
    max_images: 100
    # Visual subfolder under output. Options: folder name or placeholder template.
    output_subdir: visuals
    # Sampling mode. Options: first, last, random.
    sampling_mode: first
    # Sampling seed for random mode. Options: null to use runtime.seed, or integer.
    random_seed: null
    # Candidate filter source. Options: ground_truth, prediction, either, both.
    filter_source: either
    # Candidate filter match. Options: any, all.
    filter_match: any
    # Candidate class IDs. Empty means no class filter. Options: list of category IDs.
    class_ids: []
    # Candidate class names. Empty means no class filter. Options: list of category names, e.g. [soccer_ball].
    class_names:
      - soccer_ball
    # Category IDs to draw in visual images. Empty means draw all GT/prediction classes. Options: list of category IDs.
    render_class_ids: []
    # Category names to draw in visual images. Empty means draw all GT/prediction classes. Options: list of category names.
    render_class_names:
      - soccer_ball
    # Minimum GT instances required for candidate selection. Options: non-negative integer.
    min_gt_instances: 0
    # Minimum predictions required for candidate selection. Options: non-negative integer.
    min_predictions: 0
    # Minimum prediction score used only for candidate filtering. Options: null or 0.0-1.0.
    filter_min_score: 0.25
    # Minimum prediction score drawn in visual images. Options: null to use model.confidence_threshold, or 0.0-1.0.
    draw_min_score: null
  # Write per-class test metrics JSON/CSV. Options: true, false.
  classwise: true
  # Show progress bars while evaluating images and rendering outputs. Options: true, false.
  progress_bar: true
  # Save PR/confusion/curve plots. Options: true, false.
  plots: false
  # Save raw evaluated dataset case images. Options: true, false.
  save_dataset_cases: false
  # Number of images in each saved model-input batch grid. Options: positive integer.
  model_input_batch_size: 9
  # RF-DETR full-image/class-crop evaluator batch size. Options: positive integer.
  batch_size: 4
  # DataLoader workers for TrainConfig adapter. Options: 2 by project rule.
  num_workers: 2
  # Max detections used in evaluation metrics. Options: positive integer.
  max_dets: 500
  # IoU threshold used for operating-point TP/FP/FN and error-case matching. Options: 0.0-1.0.
  match_iou_threshold: 0.5
  # Error-case diagnostic settings. Options: mapping.
  error_cases:
    # Save target-class missed/misclassified/false-positive diagnostic images. Options: true, false.
    enabled: true
    # Target category IDs. Empty means use target_class_names; if both are empty, default is football.
    target_class_ids: []
    # Target category names. Default here is soccer_ball for this one-class dataset.
    target_class_names:
      - soccer_ball
    # Category IDs to draw in error-case images. Empty means draw all GT/prediction classes. Options: list of category IDs.
    render_class_ids: []
    # Category names to draw in error-case images. Empty means draw all GT/prediction classes. Options: list of category names.
    render_class_names:
      - soccer_ball
    # Shared maximum diagnostic images to save. Options: null for all matching images, or non-negative integer.
    max_images: 100
    # Backward-compatible missed-image cap. Options: null or non-negative integer.
    max_missed_images: 100
    # Backward-compatible false-positive-image cap. Options: null or non-negative integer.
    max_false_positive_images: 25
    # Prediction confidence threshold for error-case matching. Options: null to use model/evaluation threshold, or 0.0-1.0.
    confidence_threshold: null
    # IoU threshold for error-case matching. Options: null to use evaluation.match_iou_threshold, or 0.0-1.0.
    match_iou_threshold: null
    # Error-case subfolder under output. Options: folder name or placeholder template.
    output_subdir: error_cases
    # Image format. Options: jpg, png.
    format: jpg
    # JPEG quality when format=jpg. Options: 1-100.
    jpeg_quality: 92

# Metric/evaluation settings. Options: mapping.
evaluation:
  # Evaluation type. Options: auto, bbox, segm, segmentation, mask, masks.
  type: auto
  # Write per-class metrics. Options: true, false.
  classwise: true
  # COCO max detections list. Options: one, two, or three positive integers.
  max_detections: [1, 10, 500]
  # Operating-point and error-case IoU threshold. Options: 0.0-1.0.
  match_iou_threshold: 0.5
