# One-window, one-epoch real-temporal RF-DETR Small + P2 + TrackNetV5 micro preset.
# Inherits the P2 [P2, P3, P4] projector and the real-temporal TrackNetV5 module.
extends: rf_detr_train_small_p2_tracknet_v5.yaml

runtime:
  verbose: true
  dry_run: false
  confirm_before_run: true

model:
  size: small
  # Micro-smoke only: 128 is divisible by Small's patch/window block (16*2).
  resolution: 128
  pretrain_weights: default
  num_classes: 1
  motion:
    enabled: true
    type: tracknet_v5
    temporal:
      mode: real
      fallback_mode: real
      num_frames: 3
      frame_stride: 1
      anchor: center
      boundary_policy: drop
      allow_single_frame_fallback: false
      backbone_grad_mode: center_only
    focus:
      # Override with --tracknet-focus single when validating primary-ball mode.
      mode: all
      primary_field: primary_label_index
    tracknet_v5:
      feature_source: all_frames
      feature_level: highest_resolution
      mdd:
        enabled: true
        polarity_channels: 4
        attention:
          learnable: true
          init_alpha: 0.2
          init_beta: 0.15
          epsilon: 0.000001
      heatmap:
        target: bbox_gaussian
        min_sigma: 1.0
        peak_threshold: 0.5
        peak_nms_kernel: 3
        max_peaks: 20
      rstr:
        enabled: true
        num_blocks: 1
        hidden_dim: 64
        num_heads: 4
        attention_mode: divided
        dropout: 0.0
        patch_size: 16
        context_mask_prob: 0.0
      fusion:
        mode: zero_init_residual
    loss:
      heatmap_weight: 1.0
      gamma: 2.0
    overrides:
      num_queries: 50
      num_select: 50
      gradient_checkpointing: false

dataset:
  source_format: spatiotemporal_yolo
  dataset_dir: "C:/Users/XBOT/Documents/Datasets/soccer_ball_merged_v1/datasets/spatiotemporal/frame_label_process_result_smoke"
  data_yaml: "C:/Users/XBOT/Documents/Datasets/soccer_ball_merged_v1/datasets/spatiotemporal/frame_label_process_result_smoke/dataset.yaml"
  max_images: all
  temporal:
    # One complete window per split is enough for the bounded overfit smoke.
    max_windows_per_split: { train: 1, val: 1, test: 1 }

train:
  dataset_dir: "C:/Users/XBOT/Documents/Datasets/soccer_ball_merged_v1/datasets/spatiotemporal/frame_label_process_result_smoke"
  epochs: 1
  batch_size: 1
  grad_accum_steps: 1
  num_workers: 2
  multi_scale: false
  early_stopping: false
  eval_interval: 1
  checkpoint_interval: 1
  run_test: false
  tensorboard: false
  wandb: false
  mlflow: false

output:
  root: runs/rf_detr/train
  name: "rfdetr_small_p2_temporal_tracknet_{tracknet_focus}_smoke_{timestamp}"
  exist_ok: false

periodic_test:
  enabled: false
  run_final_test: false
  test_interval_epochs: 0
  test_interval_minutes: 0

demo:
  enabled: false
