[project]
name = "rf-detr-trainer"
version = "0.1.0"
description = "Config-first RF-DETR trainer with Ultralytics-style outputs, scheduled validation/test, and per-class metrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boxmot==13.0.0",
    "colorama>=0.4.6",
    "pyyaml>=6.0.0",
    "rfdetr[loggers,train]>=1.6.5",
    "sahi>=0.11.22",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm>=4.67.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]
