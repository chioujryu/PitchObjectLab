[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitch-ball-tracker"
version = "0.1.0"
description = "Ball tracking with SAM3 + BoT-SORT ReID for in-play balls"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26,<2",
    "scipy>=1.12.0",
    "omegaconf>=2.3.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "sam3",
    "einops>=0.8.2",
    "psutil>=7.2.2",
    "triton-windows>=3.6.0.post26; sys_platform == 'win32'",
    "pycocotools>=2.0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
pitch-track = "pitch_ball_tracker.cli:main"

[tool.uv.sources]
sam3 = { path = "../sam3", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/pitch_ball_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
